# Stompbox manifest — the source of truth for the studio's sessions.
# Relative paths are resolved against this file.
# After modification: stomp apply, then stomp on <session>.
#
# Session migrated from ~/Ray Sessions/homestudio (RaySession):
# Scarlett 2i2 + Morningstar MC8 pedalboard + amp sim (Ratatouille/NAM).
sessions:
  bossa:
    apps:
      - kind: carla
        # name omitted → default "bossa-carla"; UI: stomp ui carla
        preset: presets/jazz.carxp     # carla-patchbay "Jazz" (Ratatouille)
        osc_tcp_port: 1455
      # A 2nd carla requires an explicit name (otherwise collision "bossa-carla"):
      # - kind: carla
      #   name: bass
      #   preset: presets/bass.carxp
      #   osc_tcp_port: 1456
      - kind: hydrogen
        # name omitted → default "bossa-hydrogen"
        song: songs/homestudio.h2song
      - kind: sooperlooper
        # name omitted → default "bossa-sooperlooper"; UI: stomp ui sooperlooper
        osc_port: 9951
        loops: 1
        channels: 2
        looptime: 60
        midi_binding: midi/footswitch.slb   # Morningstar MC8 → SooperLooper
    patchbay:
      # To create once: wire it up in qpwgraph, save the patchbay here.
      # The source wiring is documented in patchbays/homestudio.raypatch.xml
      # (ray-jackpatch export from the old RaySession session).
      file: patchbays/default.qpwgraph
      exclusive: false

  # Funk profile: punchy clean amp (NAM 6505 clean + IR Fender Tweed),
  # compressor → chorus pedals (see presets/funk.carxp).
  funk:
    apps:
      - kind: carla
        preset: presets/funk.carxp
        osc_tcp_port: 1456
      - kind: sooperlooper
        osc_port: 9952
        loops: 1
        channels: 2
        looptime: 60
    # patchbay: wire up in qpwgraph then save, as for bossa.

  # Funk bass profile: clean, punchy Ampeg SVT (NAM "Ampeg SVT - MD 421",
  # mic'd full-rig capture so no IR) for fingerstyle/slap (presets/funk-bass.carxp).
  funk-bass:
    apps:
      - kind: carla
        preset: presets/funk-bass.carxp
        osc_tcp_port: 1459
      - kind: sooperlooper
        osc_port: 9956
        loops: 1
        channels: 2
        looptime: 60
        midi_binding: midi/footswitch.slb   # Morningstar MC8 → SooperLooper
    patchbay:
      file: patchbays/default.qpwgraph
      exclusive: false

  # Blues profile: edge-of-breakup crunch (NAM Marshall JT100 + IR JCM2000),
  # Tubescreamer → delay pedals (see presets/blues.carxp).
  blues:
    apps:
      - kind: carla
        preset: presets/blues.carxp
        osc_tcp_port: 1457
      - kind: hydrogen
        # name omitted → default "blues-hydrogen"
        song: songs/homestudio.h2song
      - kind: sooperlooper
        # name omitted → default "blues-sooperlooper"; UI: stomp ui sooperlooper
        osc_port: 9953
        loops: 1
        channels: 2
        looptime: 60
        midi_binding: midi/footswitch.slb   # Morningstar MC8 → SooperLooper
    patchbay:
      # To create once: wire it up in qpwgraph, save the patchbay here.
      # The source wiring is documented in patchbays/homestudio.raypatch.xml
      # (ray-jackpatch export from the old RaySession session).
      file: patchbays/default.qpwgraph
      exclusive: false

  # Nylon profile: nylon guitar (see presets/nylon.carxp).
  nylon:
    apps:
      - kind: carla
        preset: presets/nylon.carxp
        osc_tcp_port: 1458
      - kind: hydrogen
        # name omitted → default "nylon-hydrogen"
        song: songs/homestudio.h2song
      - kind: sooperlooper
        # name omitted → default "nylon-sooperlooper"; UI: stomp ui sooperlooper
        osc_port: 9955
        loops: 1
        channels: 2
        looptime: 60
        midi_binding: midi/footswitch.slb   # Morningstar MC8 → SooperLooper
    patchbay:
      file: patchbays/default.qpwgraph
      exclusive: false

  # Rock profile: high-gain amp sim (NAM + IR via Ratatouille) with
  # Element instead of Carla as the plugin host (see presets/rock.els).
  rock:
    apps:
      - kind: element
        # name omitted → default "rock-element"
        preset: presets/rock.els
      - kind: sooperlooper
        osc_port: 9954
        loops: 1
        channels: 2
        looptime: 60
